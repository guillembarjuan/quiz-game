<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Trivial</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/access.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/results.css">
  <link rel="stylesheet" href="css/timer.css">
</head>
<body>
  <main>

    <!-- ===== PANTALLA screen-welcome (propietari: Joan) ===== -->

    <section class="screen" id="screen-welcome">
      <div class="card access-card">
        <header>
          <p class="access-eyebrow">Quiz Trivial</p>
          <h1>Quant en saps?</h1>
          <p>Escriu el teu nom per començar a jugar.</p>
        </header>
        <form id="welcome-form" novalidate>
          <label for="player-name">Nom del jugador</label>
          <input id="player-name" name="player-name" type="text"
                 autocomplete="nickname" required
                 aria-describedby="name-help name-error">
          <p id="name-help" class="access-help">Màxim 20 caràcters.</p>
          <p id="name-error" class="access-error" role="alert"></p>
          <button class="btn btn--primary" type="submit">Començar</button>
        </form>
      </div>
    </section>

    <!-- ===== PANTALLA screen-types (propietari: Joan) ===== -->

    <section class="screen" id="screen-types">
      <!-- Joan: contingut aquí -->
    </section>

    <!-- ===== PANTALLA screen-game (propietari: Pol) ===== -->

    <section class="screen" id="screen-game">
      <!-- Pol: contingut aquí -->
      <div id="timer"></div>
    </section>

    <!-- ===== PANTALLA screen-results (propietari: Miquel) ===== -->

    <section class="screen" id="screen-results">
      <!-- Miquel: contingut aquí -->
    </section>

  </main>

  <script src="js/questions.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/access.js"></script>
  <script src="js/game.js"></script>
  <script src="js/results.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
